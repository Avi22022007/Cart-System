apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cart-v1
  template:
    metadata:
      labels:
        app: cart-v1
    spec:
      containers:
        - name: cart
          image: avi22022007/cart-system:v1
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: cart-v1-service
spec:
  type: NodePort
  selector:
    app: cart-v1
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30001