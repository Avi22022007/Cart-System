
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cart-v2
  template:
    metadata:
      labels:
        app: cart-v2
    spec:
      containers:
        - name: cart
          image: avi22022007/cart-system:v2
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: cart-v2-service
spec:
  type: NodePort
  selector:
    app: cart-v2
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30002
